# Build and publish triplit-console Docker image for VPS
# Watchtower on VPS auto-pulls new images
name: Build and Push Console Image

on:
  push:
    branches: [main]
    paths:
      - 'packages/console/**'
      - 'packages/client/**'
      - 'packages/db/**'
      - 'packages/logger/**'
      - 'packages/types/**'
      - 'packages/react/**'
      - '.github/workflows/build-and-push-console.yml'
  workflow_dispatch:  # Manual trigger

env:
  IMAGE_NAME: adespaignet/triplit-console

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/console/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
