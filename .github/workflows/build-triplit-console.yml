name: Build Triplit Console

on:
  push:
    branches: [main]
    paths:
      - "packages/console/**"
      - "packages/client/**"
      - "packages/db/**"
      - "packages/logger/**"
      - "packages/types/**"
      - "packages/react/**"
      - ".github/workflows/build-triplit-console.yml"
  workflow_dispatch:

jobs:
  build-console-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build @triplit/logger
        run: npx tsc --build
        working-directory: packages/logger

      - name: Build @triplit/types
        run: npx tsc
        working-directory: packages/types

      - name: Build @triplit/db
        run: npx tsc
        working-directory: packages/db

      - name: Build @triplit/client
        run: npx tsc
        working-directory: packages/client

      - name: Build @triplit/react
        run: npx tsc
        working-directory: packages/react

      - name: Build console web bundle
        run: corepack yarn build:web
        working-directory: packages/console
