name: Build Triplit Console

on:
  push:
    branches: [main]
    paths:
      - "packages/console/**"
      - ".github/workflows/build-triplit-console.yml"
  workflow_dispatch:

jobs:
  build-console-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build @triplit/client (console runtime dep)
        run: corepack yarn workspace @triplit/client build

      - name: Build console web bundle
        run: corepack yarn build:web
        working-directory: packages/console
